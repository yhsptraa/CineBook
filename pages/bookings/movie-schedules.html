<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CineBook - Select Schedule</title>
        <link rel="stylesheet" href="../../../assets/css/base/reset.css">
        <link rel="stylesheet" href="../../../assets/css/base/root.css">
        <link rel="stylesheet" href="../../../assets/css/pages/bookings/movie-schedules.css">
    </head>
    <body>
        <header id="header-container">
            <nav id="navbar-container">
                <a class="logo" href="../../../index.html">Kembali</a>
            </nav>
        </header>
        <main id="main-container">
            <section class="schedule-section">
                <h2 class="page-title">Pilih jadwal nonton</h2>
                <div class="movie-summary-card">
                    <img id="movie-poster" src="" alt="Poster Film">
                    <div class="movie-info">
                        <h3 id="movie-title">Memuat film...</h3>
                        <p class="movie-genre" id="movie-genre">-</p>
                        <p class="movie-price">Harga: <span id="movie-price">Rp 0</span> / tiket</p>
                    </div>
                </div>
                <div class="option-group">
                    <p class="option-title"><i class="fa-regular fa-calendar"></i> Pilih tanggal</p>
                    <div class="button-list" id="date-list"></div>
                </div>
                <div class="option-group">
                    <p class="option-title"><i class="fa-solid fa-building"></i> Pilih studio</p>
                    <div class="button-list" id="studio-list"></div>
                </div>
                <div class="option-group">
                    <p class="option-title"><i class="fa-regular fa-clock"></i> Pilih jam tayang</p>
                    <div class="button-list" id="time-list"></div>
                </div>
                <button id="next-button" class="submit-btn" disabled>
                    Lanjut pilih kursi <i class="fa-solid fa-arrow-right"></i>
                </button>
            </section>
        </main>
        <script src="../../../assets/js/data/movies-dummy.js"></script>
        <script src="../../../assets/js/pages/bookings/movie-schedules.js"></script>
    </body>
</html>
