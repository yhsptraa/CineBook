<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CineBook</title>
  
    <link rel="stylesheet" href="../assets/css/pages/movies/auth.css">
</head>
<body>
<div class="login-container">
    <div class="brand-title">CineBook</div>
    <div class="brand-subtitle">Masuk untuk memesan tiket film favorit Anda</div>
    
    
    <div id="error-box" class="error-box" style="display: none;"></div>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="email">Alamat Email</label>
            <input type="email" id="email" placeholder="Masukkan email Anda" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan password" required>
        </div>
        <button type="submit" class="btn-login">MASUK</button>
    </form>
    
    <div class="switch-page">Belum punya akun? <a href="user/register.html">Daftar Sekarang</a></div>
    
    <div style="margin-top: 20px; font-size: 11px; color: #9ca3af; text-align: center; border-top: 1px dashed #e5e7eb; padding-top: 10px;">
        Akun Demo: sabil@cinebook.com | Pas: cinema2026
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('error-box');
    errorBox.style.display = 'none';

    
    if (email === 'admin@cinebook.com' && password === 'cinema2026') {
        sessionStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('userNama', 'Admin CineBook');
        sessionStorage.setItem('userEmail', 'admin@cinebook.com');
        
        
        if (window.top !== window.self) {
            window.top.location.href = '../index.html';
        } else {
            window.location.href = '../index.html';
        }
        return;
    }

    
    const users = JSON.parse(localStorage.getItem('users') || '[]');
    const user = users.find(u => u.email === email && u.password === password);

    if (user) {
        sessionStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('userNama', user.nama);
        sessionStorage.setItem('userEmail', user.email);
        
        if (window.top !== window.self) {
            window.top.location.href = '../index.html';
        } else {
            window.location.href = '../index.html';
        }
    } else {
        
        errorBox.innerText = "Email atau password salah.";
        errorBox.style.display = 'block';
    }
});
</script>
</body>
</html>
