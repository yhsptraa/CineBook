<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CineBook</title>
  
    <link rel="stylesheet" href="../assets/css/pages/movies/auth.css">
</head>
<body>
<div class="login-container">
    <div class="brand-title">CineBook</div>
    <div class="brand-subtitle">Masuk untuk memesan tiket film favorit Anda</div>
    
    
    <div id="error-box" class="error-box" style="display: none;"></div>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="email">Alamat Email</label>
            <input type="email" id="email" placeholder="Masukkan email Anda" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan password" required>
        </div>
        <button type="submit" class="btn-login">MASUK</button>
    </form>
    
    <div class="switch-page">Belum punya akun? <a href="user/register.html">Daftar Sekarang</a></div>
    
    <div style="margin-top: 20px; font-size: 11px; color: #9ca3af; text-align: center; border-top: 1px dashed #e5e7eb; padding-top: 10px;">
        Akun Demo: test_user@gmail.com | Password: 12345678
    </div>
</div>

<script src="../assets/js/data/users-dummy.js"></script>
<script src="../assets/js/data/booking-dummy.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('error-box');
    errorBox.style.display = 'none';

    const registeredUsers = JSON.parse(localStorage.getItem('users') || '[]');
    const dummyUser = userData.find(user => user.email === email && user.password === password);
    const registeredUser = registeredUsers.find(user => user.email === email && user.password === password);
    const user = dummyUser || registeredUser;

    if (user) {
        const userId = user.id ?? `registered-${user.email}`;
        const userName = user.name || user.nama;

        sessionStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('currentUserId', String(userId));
        sessionStorage.setItem('userNama', userName);
        sessionStorage.setItem('userEmail', user.email);
        
        if (window.top !== window.self) {
            window.top.location.href = '../index.html';
        } else {
            window.location.href = '../index.html';
        }
    } else {
        
        errorBox.innerText = "Email atau password salah.";
        errorBox.style.display = 'block';
    }
});
</script>
</body>
</html>
