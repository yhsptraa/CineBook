<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBook - Cinema Booking</title>
    <link rel="stylesheet" href="assets/css/base/reset.css">
    <link rel="stylesheet" href="assets/css/base/root.css">
    <link rel="stylesheet" href="assets/css/pages/movies/movie-dashboard.css">
    <link rel="stylesheet" href="assets/css/pages/movies/movie-header.css">
    <link rel="stylesheet" href="assets/css/pages/movies/movie-footer.css">
    <script src="https://kit.fontawesome.com/baa7ec279b.js" crossorigin="anonymous"></script>
</head>

<body>
    <!-- Dashboard Header Section -->
    <header id="header-container">
        <nav id="navbar-container">
            <a class="logo" href="#">Cine<span class="logo-span">Book</span></a>
            <div id="hamburger-menu-container">
                <div id="close-button-container">
                    <p class="logo">Cine<span class="logo-span">Book</span></p>
                    <button id="close-button" type="button">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div id="menu-container">
                    <a href="#now-playing-title" class="menu">NOW PLAYING</a>
                    <a href="#coming-soon-title" class="menu">COMING SOON</a>
                    <a href="./pages/movies/transaction-history.html" class="menu">HISTORY</a>
                </div>
                <div id="search-container">
                    <button id="search-button">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                    <input type="text" placeholder="Search" id="input-box">
                </div>
                <div id="auth-container">
                    <a href="pages/login.html">LOGIN</a>
                    <a href="pages/user/register.html">REGISTER</a>
                </div>
            </div>
            <button id="hamburger-button" type="button">
                <i class="fa-solid fa-bars"></i>
            </button>
        </nav>
    </header>

    <!-- Dashboard Main Section -->
    <main id="main-container">
        <section id="main-menu-container">
            <div class="button-container">
                <a class="main-menu-button" href="pages/cinemas/cinema.html" aria-label="Lihat bioskop">
                    <i class="fa-solid fa-film"></i>
                </a>
                <p class="menu-description">Cinema</p>
            </div>
            <div class="button-container">
                <a class="main-menu-button" href="#now-playing-title" aria-label="Lihat film yang sedang tayang">
                    <i class="fa-solid fa-ticket"></i>
                </a>
                <p class="menu-description">Film</p>
            </div>
            <div class="button-container">
                <a class="main-menu-button" href="pages/food/food.html" aria-label="Lihat menu makanan">
                    <i class="fa-solid fa-pizza-slice"></i>
                </a>
                <p class="menu-description">Food</p>
            </div>
            <div class="button-container">
                <a class="main-menu-button" href="pages/user/profile.html" aria-label="Buka profil pengguna">
                    <i class="fa-solid fa-user"></i>
                </a>
                <p class="menu-description">User </p>
            </div>
        </section>
        <section class="content-section">
            <div class="section-heading">
                <h2 id="trending-title">Trending</h2>
            </div>
            <div class="horizontal-list" id="trending-movie-list">

            </div>
        </section>
        <section class="content-section">
            <div class="section-heading">
                <h2 id="now-playing-title">Now Playing</h2>
            </div>
            <div class="horizontal-list" id="now-playing-movie-list">

            </div>
        </section>
        <section class="content-section">
            <div class="section-heading">
                <h2 id="coming-soon-title">Coming Soon</h2>
            </div>
            <div class="horizontal-list" id="coming-soon-movie-list">

            </div>
        </section>
    </main>

    <!-- Footer Section -->
    <footer id="footer-container">
        <a class="logo" href="#">Cine<span class="logo-span">Book</span></a>
        <div id="social-media-container">
            <button id="instagram-button" class="social-media-button" type="button">
                <i class="fa-brands fa-instagram"></i>
            </button>
            <button id="tiktok-button" class="social-media-button" type="button">
                <i class="fa-brands fa-tiktok"></i>
            </button>
            <button id="youtube-button" class="social-media-button" type="button">
                <i class="fa-brands fa-youtube"></i>
            </button>
            <button id="twitter-button" class="social-media-button" type="button">
                <i class="fa-brands fa-x-twitter"></i>
            </button>
            <button id="facebook-button" class="social-media-button" type="button">
                <i class="fa-brands fa-facebook"></i>
            </button>
        </div>
        <div id="footer-menu-container">
            <a href="#">About Us</a>
            <a href="#">FAQ</a>
            <a href="#">Privacy Management</a>
            <a href="#">Contact Us</a>
        </div>
        <p id="copyright">&copy; 2026 Cinebook</p>
    </footer>
    <script src="assets/js/data/movies-dummy.js"></script>
    <script src="assets/js/pages/movies/movie-dashboard.js"></script>
    <script>
document.addEventListener("DOMContentLoaded", function() {
    const isLoggedIn = sessionStorage.getItem('isLoggedIn');
    const userNama = sessionStorage.getItem('userNama');
    const authContainer = document.getElementById('auth-container');

    if (isLoggedIn === 'true' && userNama) {
        authContainer.innerHTML = `
            <span class="user-greeting">HI, ${userNama.toUpperCase()}</span>
            <a href="#" id="logout-btn">LOGOUT</a>
        `;
        
        document.getElementById('logout-btn').addEventListener('click', function(e) {
            e.preventDefault();
            sessionStorage.removeItem('isLoggedIn');
            sessionStorage.removeItem('currentUserId');
            sessionStorage.removeItem('userNama');
            sessionStorage.removeItem('userEmail');
            window.location.reload();
        });
    }
});
</script>
</body>
</html>
